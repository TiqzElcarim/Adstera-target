<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat & Earn</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }

body {
  font-family: 'Inter', sans-serif;
  background: #6b21a8;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 24px 60px;
}

/* Share icon */
.share {
  position: fixed;
  top: 20px;
  right: 20px;
  color: rgba(255,255,255,0.8);
  font-size: 20px;
  cursor: pointer;
  z-index: 10;
}

.page {
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Profile photo */
.avatar {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid rgba(255,255,255,0.3);
  margin-bottom: 12px;
}

/* Name */
.name {
  font-size: 15px;
  font-weight: 500;
  color: #fff;
  margin-bottom: 20px;
}

/* Social icons */
.socials {
  display: flex;
  gap: 10px;
  margin-bottom: 28px;
}
.sicon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  text-decoration: none;
  cursor: pointer;
}
.sicon.ig { background: #E1306C; }
.sicon.tk { background: #000; }
.sicon.tw { background: #1DA1F2; }
.sicon.yt { background: #FF0000; }

/* Buttons */
.links {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}

.btn {
  display: block;
  width: 100%;
  padding: 15px 20px;
  border-radius: 8px;
  background: rgba(255,255,255,0.18);
  color: #fff;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 400;
  text-align: left;
  text-decoration: none;
  border: none;
  cursor: pointer;
  transition: background 0.15s;
  letter-spacing: 0.1px;
}
.btn:active { background: rgba(255,255,255,0.28); }

/* Payment popup */
.popup-wrap {
  position: fixed;
  bottom: 24px;
  left: 14px;
  z-index: 999;
  pointer-events: none;
}
.popup {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(60,10,90,0.96);
  border: 1px solid rgba(255,255,255,0.15);
  border-left: 3px solid #c084fc;
  padding: 10px 14px;
  border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1), popOut 0.4s ease 7s forwards;
  max-width: 260px;
}
.popup img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.popup-info { font-size: 12px; color: #ddd; line-height: 1.5; }
.popup-info b { color: #c084fc; }
.popup-method { font-size: 10px; color: #888; margin-top: 2px; }
@keyframes popIn  { from { transform: translateX(-120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes popOut { to   { transform: translateX(-120%); opacity: 0; } }
</style>
</head>
<body>

<div class="popup-wrap" id="popups"></div>

<div class="share">⤴</div>

<div class="page">

  <img class="avatar" src="https://i.imgur.com/OrPHarQ.jpeg" alt="Profile">

  <div class="name">Graceful</div>

  <div class="socials">
    <!-- Instagram -->
    <a class="sicon ig" href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">

      </svg>
    </a>

  </div>

  <div class="links">
    <a href="https://1buv.com/link?z=10723592&var={SOURCE_ID}&ymid={CLICK_ID}" class="btn" style="
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      border-radius: 50px;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 24px rgba(37,211,102,0.4);
      position: relative;
      overflow: hidden;
    ">

      Contact Me
      <span style="position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);animation:sheen 2.5s infinite;"></span>
    </a>
  </div>

</div>

<script>
var namesMale   = ["Kwame","Emeka","Tunde","Musa","David","John","Ibrahim","Chidi","Felix","Samuel"];
var namesFemale = ["Amara","Fatima","Ngozi","Grace","Aisha","Akosua","Zuri","Blessing","Yetunde","Adaeze"];
var countries   = ["Nigeria","Kenya","Ghana","Uganda","Tanzania","Cameroon","South Africa","Zambia","Zimbabwe","Senegal"];
var methods     = ["M-Pesa","MTN MoMo","OPay","Airtel Money","PayPal","USDT","Bank Transfer"];
var malePhotos  = [32,44,55,67,12,75,23,88,7,91].map(function(n){return 'https://randomuser.me/api/portraits/men/'+n+'.jpg';});
var femalePhotos= [44,22,65,31,77,54,13,89,6,38].map(function(n){return 'https://randomuser.me/api/portraits/women/'+n+'.jpg';});
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

function createPopup(){
  var wrap = document.getElementById("popups");
  if(wrap.children.length >= 1) return;
  var isMale = Math.random() > 0.5;
  var name   = isMale ? pick(namesMale) : pick(namesFemale);
  var photo  = isMale ? pick(malePhotos) : pick(femalePhotos);
  var amount = (Math.random()*180+20).toFixed(2);
  var d = document.createElement("div");
  d.className = "popup";
  d.innerHTML = '<img src="'+photo+'" alt="'+name+'" onerror="this.src=\'https://ui-avatars.com/api/?name='+name+'&background=3c0a5a&color=c084fc&size=36\'">'
    + '<div class="popup-info"><b>'+name+'</b> from '+pick(countries)+'<br>just earned <b>$'+amount+'</b>'
    + '<div class="popup-method">💳 via '+pick(methods)+'</div></div>';
  wrap.appendChild(d);
  setTimeout(function(){ d.remove(); }, 7600);
}
setInterval(createPopup, 3000);
</script>
</body>
</html>
