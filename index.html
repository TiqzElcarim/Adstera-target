<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Are You In Africa?</title>
<style>
  :root{
    --green-dark:#1f6b3a;
    --green:#2e8b4f;
    --green-light:#e8f3ea;
    --ink:#1c2b29;
    --sub:#3d5a53;
    --bg:#eaf3ec;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 50% 0%, #f4faf6 0%, var(--bg) 60%, #d9ebe0 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }
  .card{
    width:100%;
    max-width:400px;
    background:#fff;
    border-radius:32px;
    padding:36px 26px 30px;
    box-shadow:0 20px 60px rgba(30,80,50,0.18), 0 4px 14px rgba(30,80,50,0.08);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:140px; height:6px;
    border-radius:0 0 8px 8px;
    background:linear-gradient(90deg, var(--green-dark), var(--green));
  }
  h1{
    font-size:2.15rem;
    line-height:1.12;
    text-align:center;
    letter-spacing:-0.01em;
    color:var(--ink);
    font-weight:800;
    margin-top:14px;
  }
  h1 span{
    display:block;
    color:var(--green);
  }
  .pitch{
    background:var(--green-light);
    border-radius:20px;
    padding:20px 22px;
    text-align:center;
    color:var(--sub);
    font-size:1.05rem;
    font-weight:600;
    line-height:1.45;
    margin-top:22px;
  }
  .timer-row{
    margin-top:34px;
    border:1px solid #dbe8de;
    border-radius:18px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .timer-label{
    font-weight:700;
    color:var(--ink);
    font-size:1.02rem;
  }
  .timer-box{
    background:#fff;
    border:1px solid #e3eee6;
    border-radius:999px;
    padding:8px 18px;
    font-variant-numeric:tabular-nums;
    font-weight:800;
    font-size:1.4rem;
    color:var(--green-dark);
    display:flex;
    align-items:baseline;
    gap:2px;
    box-shadow:0 2px 8px rgba(30,80,50,0.06);
  }
  .timer-box small{
    font-size:0.62rem;
    font-weight:700;
    color:var(--sub);
    margin:0 4px;
  }
  .cta{
    margin-top:34px;
    width:100%;
    border:none;
    cursor:pointer;
    padding:20px 0;
    border-radius:999px;
    background:linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);
    color:#fff;
    font-size:1.3rem;
    font-weight:800;
    letter-spacing:0.03em;
    box-shadow:0 14px 26px rgba(31,107,58,0.35);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .cta:active{
    transform:translateY(2px) scale(0.99);
    box-shadow:0 8px 16px rgba(31,107,58,0.3);
  }
  .footnote{
    margin-top:16px;
    text-align:center;
    color:#9aa9a3;
    font-size:0.85rem;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .pay-toast{
    position:fixed;
    left:16px;
    bottom:16px;
    max-width:300px;
    background:#fff;
    border-radius:14px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 12px 30px rgba(20,50,35,0.22);
    border:1px solid #e3eee6;
    transform:translateY(120%);
    opacity:0;
    transition:transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .35s ease;
    z-index:50;
  }
  .pay-toast.show{
    transform:translateY(0);
    opacity:1;
  }
  .pay-toast .avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--green), var(--green-dark));
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:0.95rem;
    flex-shrink:0;
  }
  .pay-toast .msg{
    font-size:0.88rem;
    line-height:1.32;
    color:var(--ink);
  }
  .pay-toast .msg b{
    color:var(--green-dark);
  }
  .pay-toast .msg .time{
    display:block;
    color:#9aa9a3;
    font-size:0.75rem;
    font-weight:600;
    margin-top:2px;
  }
  @media (max-width:420px){
    .pay-toast{ left:10px; right:10px; max-width:none; bottom:12px; }
  }
</style>
</head>
<body>

<div class="card">
  <h1>ARE YOU<span>IN AFRICA?</span></h1>

  <div class="pitch" id="pitchText">
    Get up to $85 daily by chatting online. Earn in Dollar and withdraw in Naira. Click below to Continue
  </div>

  <div class="timer-row">
    <span class="timer-label">Offer ends in</span>
    <div class="timer-box">
      <span id="mins">20</span><small>m</small>:<span id="secs">00</span><small>s</small>
    </div>
  </div>

  <button class="cta" onclick="window.location.href='https://1buv.com/link?z=10723592&var={SOURCE_ID}&ymid={CLICK_ID}'">START NOW</button>

  <div class="footnote">🔒 Limited Time Access • Don't Miss Out.</div>
</div>

<div class="pay-toast" id="payToast">
  <div class="avatar" id="payAvatar">O</div>
  <div class="msg">
    <span id="payText"><b>Obinna</b> just received $59</span>
    <span class="time" id="payTime">Just now</span>
  </div>
</div>

<script>
  // ---- Fallback / manual override: used if geo-detection fails or is disabled ----
  var DEFAULT_CURRENCY = "Naira";

  // ---- Currency by country (ISO 3166-1 alpha-2 code -> local currency) ----
  var CURRENCY_MAP = {
    NG: "Naira",
    KE: "Shillings",
    GH: "Cedis",
    ZW: "Zim Dollars",
    CM: "CFA Francs",
    MZ: "Meticais",
    NA: "Namibian Dollars"
  };
  // Fallback for visitors outside the mapped list
  var GENERIC_CURRENCY = "your local currency";

  function renderPitch(currency){
    document.getElementById('pitchText').textContent =
      'Get up to $85 daily by chatting online. Earn in Dollar and withdraw in ' + currency + '. Click below to Continue';
  }

  // Render the default immediately so the page never looks broken/blank while geolocation loads
  renderPitch(DEFAULT_CURRENCY);

  // ---- Auto-detect visitor's country via IP, personalize the currency only (falls back silently on any failure) ----
  fetch('https://ipapi.co/json/')
    .then(function(res){ return res.json(); })
    .then(function(data){
      var code = data && data.country_code;
      if (!code) return;
      renderPitch(CURRENCY_MAP[code] || GENERIC_CURRENCY);
    })
    .catch(function(){
      // Geolocation failed (offline, blocked, rate-limited) — DEFAULT_CURRENCY stays on screen
    });

  // ---- Countdown timer (resets to 20:00 on load, persists via sessionStorage) ----
  var endKey = 'offerEndsAt';
  var end = sessionStorage.getItem(endKey);
  if (!end) {
    end = Date.now() + 20 * 60 * 1000;
    sessionStorage.setItem(endKey, end);
  } else {
    end = parseInt(end, 10);
  }
  function tick(){
    var diff = Math.max(0, end - Date.now());
    var m = Math.floor(diff / 60000);
    var s = Math.floor((diff % 60000) / 1000);
    document.getElementById('mins').textContent = m;
    document.getElementById('secs').textContent = (s < 10 ? '0' : '') + s;
    if (diff <= 0) {
      sessionStorage.removeItem(endKey);
    }
  }
  tick();
  setInterval(tick, 1000);

  // ---- Animated payment notification toast ----
  var PAYERS = [
    "Obinna", "Chiamaka", "Kwame", "Amara", "Tendai",
    "Ngozi", "Kofi", "Fatima", "Emeka", "Wanjiru",
    "Abdul", "Chinwe", "Sipho", "Adaeze", "Baraka"
  ];
  var payToast = document.getElementById('payToast');
  var payAvatar = document.getElementById('payAvatar');
  var payText = document.getElementById('payText');
  var payTime = document.getElementById('payTime');

  function randomAmount(){
    return (Math.floor(Math.random() * 71) + 15); // $15 - $85
  }
  function randomMinutesAgo(){
    var n = Math.floor(Math.random() * 12) + 1;
    return n === 1 ? "1 minute ago" : n + " minutes ago";
  }
  function showPayment(){
    var name = PAYERS[Math.floor(Math.random() * PAYERS.length)];
    var amount = randomAmount();
    payAvatar.textContent = name.charAt(0);
    payText.innerHTML = '<b>' + name + '</b> just received $' + amount;
    payTime.textContent = randomMinutesAgo();
    payToast.classList.add('show');
    setTimeout(function(){
      payToast.classList.remove('show');
    }, 4200);
  }
  setTimeout(showPayment, 1500);
  setInterval(showPayment, 7000);
</script>

</body>
</html>
